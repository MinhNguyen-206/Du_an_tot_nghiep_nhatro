# ===================== KET NOI DATABASE (SQL SERVER) =====================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=QuanLyNhaTro;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===================== JPA / HIBERNATE =====================
# Schema da duoc tao san bang file SQL. Dung "none" de Hibernate khong tu y sua cau truc bang.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================== SERVER =====================
server.port=8080

# ===================== JSP VIEW RESOLVER =====================
# Controller tra ve ten view (VD: "auth/login") se duoc resolve thanh
# /WEB-INF/jsp/auth/login.jsp
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# ===================== JACKSON (format ngay thang JSON tra ve FE) =====================
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh
