# ===================== KET NOI DATABASE (SQL SERVER) =====================
# Dùng cấu hình local mặc định trực tiếp để tránh trường hợp biến môi trường rỗng.
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=QuanLyNhaTro;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===================== JPA / HIBERNATE =====================
# Schema da duoc tao san bang file SQL. Dung "none" de Hibernate khong tu y sua cau truc bang.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================== SERVER =====================
server.port=8080

# ===================== EMAIL (dung cho chuc nang Quen mat khau) =====================
# Vi du voi Gmail: MAIL_USERNAME la dia chi gmail cua ban, MAIL_PASSWORD la
# "App Password" 16 ky tu (KHONG phai mat khau gmail thuong) - tao tai
# https://myaccount.google.com/apppasswords (yeu cau da bat xac thuc 2 buoc).
# Neu KHONG dien MAIL_USERNAME/MAIL_PASSWORD, he thong se khong gui duoc email
# that, nhung se TU DONG in link khoi phuc mat khau ra console de ban van
# test duoc luong "quen mat khau" ma khong can cau hinh SMTP that.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# Dung de ghep thanh link day du gui trong email, vi du:
# http://localhost:9090/reset-password?token=xxx
app.reset-password.base-url=${APP_BASE_URL:http://localhost:8080}

# ===================== JSP VIEW RESOLVER =====================
# Controller tra ve ten view (VD: "auth/login") se duoc resolve thanh
# /WEB-INF/jsp/auth/login.jsp
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# ===================== JACKSON (format ngay thang JSON tra ve FE) =====================
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh
