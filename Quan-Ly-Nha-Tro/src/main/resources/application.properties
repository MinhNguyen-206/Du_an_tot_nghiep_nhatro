# ===================== KET NOI DATABASE (SQL SERVER) =====================
# Gia tri lay tu bien moi truong, co fallback cho may local cua ban de tien dev.
# KHONG commit mat khau that len Git. Xem application-local.properties.example
# de tao file rieng application-local.properties (da duoc gitignore).
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=QuanLyNhaTro;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===================== JPA / HIBERNATE =====================
# Schema da duoc tao san bang file SQL. Dung "none" de Hibernate khong tu y sua cau truc bang.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================== SERVER =====================
server.port=8080

# ===================== JSP VIEW RESOLVER =====================
# Controller tra ve ten view (VD: "auth/login") se duoc resolve thanh
# /WEB-INF/jsp/auth/login.jsp
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# ===================== JACKSON (format ngay thang JSON tra ve FE) =====================
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh
