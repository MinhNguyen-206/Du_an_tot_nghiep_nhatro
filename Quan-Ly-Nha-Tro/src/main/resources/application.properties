# ============================================================
# KẾT NỐI DATABASE - SQL SERVER
# ============================================================

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=QuanLyNhaTro12;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# ============================================================
# JPA / HIBERNATE
# ============================================================

# Database đã có sẵn cấu trúc bảng bằng SQL
spring.jpa.hibernate.ddl-auto=none

# Giữ nguyên tên bảng/cột trong Entity
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# Hiển thị SQL Hibernate chạy trong Console
spring.jpa.show-sql=true

# Format SQL cho dễ đọc
spring.jpa.properties.hibernate.format_sql=true

# Không giữ EntityManager mở trong View
spring.jpa.open-in-view=false


# ============================================================
# SERVER
# ============================================================

server.port=8080


# ============================================================
# EMAIL - GMAIL SMTP
# ============================================================
# Dùng cho chức năng QUÊN MẬT KHẨU

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000


# ============================================================
# RESET PASSWORD
# ============================================================

app.reset-password.base-url=${APP_BASE_URL:http://localhost:8080}


# ============================================================
# JWT
# ============================================================

# Không hard-code secret thật trong source.
# JWT_SECRET phải được cấu hình trên máy chạy ứng dụng.
app.jwt.secret=${JWT_SECRET:}


# ============================================================
# GEMINI AI
# ============================================================

# Không hard-code API key thật trong source.
# GEMINI_API_KEY chỉ cần thiết khi sử dụng chức năng AI.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}


# ============================================================
# JSP VIEW RESOLVER
# ============================================================

# Controller:
# return "auth/login";
#
# Spring sẽ tìm:
# /WEB-INF/jsp/auth/login.jsp

spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp


# ============================================================
# JACKSON
# ============================================================

spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh


# ============================================================
# DEBUG LỖI 500
# ============================================================

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true


# ============================================================
# LOG SPRING WEB
# ============================================================

logging.level.org.springframework.web=DEBUG


# ============================================================
# LOG SPRING SECURITY
# ============================================================

logging.level.org.springframework.security=DEBUG


# ============================================================
# LOG HIBERNATE SQL
# ============================================================

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE


