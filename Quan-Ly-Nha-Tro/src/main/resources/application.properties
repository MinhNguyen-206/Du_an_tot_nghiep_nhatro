# ============================================================
# RESET PASSWORD
# ============================================================

app.reset-password.base-url=${APP_BASE_URL:http://localhost:8080}


# ============================================================
# JWT
# ============================================================

# Không hard-code secret thật trong source.
# JWT_SECRET phải được cấu hình trên máy chạy ứng dụng.
app.jwt.secret=${JWT_SECRET:}


# ============================================================
# GEMINI AI
# ============================================================

# Không hard-code API key thật trong source.
# GEMINI_API_KEY chỉ cần thiết khi sử dụng chức năng AI.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}


# ============================================================
# JSP VIEW RESOLVER
# ============================================================

# Controller:
# return "auth/login";
#
# Spring sẽ tìm:
# /WEB-INF/jsp/auth/login.jsp

spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp


# ============================================================
# JACKSON
# ============================================================

spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh


# ============================================================
# DEBUG LỖI 500
# ============================================================

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true


# ============================================================
# LOG SPRING WEB
# ============================================================

logging.level.org.springframework.web=DEBUG


# ============================================================
# LOG SPRING SECURITY
# ============================================================

logging.level.org.springframework.security=DEBUG


# ============================================================
# LOG HIBERNATE SQL
# ============================================================

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE


