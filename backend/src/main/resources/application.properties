# ===================== KET NOI DATABASE (SQL SERVER) =====================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=QuanLyNhaTro;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===================== JPA / HIBERNATE =====================
# Schema da duoc tao san bang file SQL. Dung "none" de Hibernate khong tu y sua cau truc bang.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Rat quan trong: Giu nguyen ten cot camelCase trong @Column(name="...") - khong chuyen sang snake_case
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ===================== SERVER =====================
server.port=8080

# ===================== JACKSON (format ngay thang JSON tra ve FE) =====================
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# ===================== JSP VIEW RESOLVER =====================
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# ===================== DEBUG SECURITY (XOA SAU KHI FIX XONG) =====================
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=DEBUG
