# ===================== KET NOI DATABASE (SQL SERVER) =====================
# Cấu hình SQL Server local

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=QuanLyNhaTro1;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


# ===================== JPA / HIBERNATE =====================

# Database đã có sẵn cấu trúc bảng bằng SQL
spring.jpa.hibernate.ddl-auto=none

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

# Tắt Open EntityManager in View
spring.jpa.open-in-view=false


# ===================== SERVER =====================

server.port=8080


# ===================== EMAIL =====================
# Dùng cho chức năng Quên mật khẩu

# Gmail SMTP
spring.mail.host=${MAIL_HOST:smtp.gmail.com}

spring.mail.port=${MAIL_PORT:587}

spring.mail.username=${MAIL_USERNAME:}

spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true

spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000

spring.mail.properties.mail.smtp.timeout=5000


# ===================== RESET PASSWORD =====================

# URL dùng để tạo link reset password
app.reset-password.base-url=${APP_BASE_URL:http://localhost:8080}


# ===================== JSP VIEW RESOLVER =====================

# Controller trả về:
# "auth/login"
#
# Spring sẽ tìm:
# /WEB-INF/jsp/auth/login.jsp

spring.mvc.view.prefix=/WEB-INF/jsp/

spring.mvc.view.suffix=.jsp


# ===================== JACKSON =====================

spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

spring.jackson.time-zone=Asia/Ho_Chi_Minh

# ===================== DEBUG LOI 500 =====================
# TAM THOI bat de hien exception that tren trinh duyet
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE


